# chadtab.com on gw33: plain files from /var/www/chadtab.com/public (the site, and ci/ which chadtab's own
# CI writes).  http answers 301 to https except certbot's renewals; www answers 301 to the apex.
# No scripts anywhere on the site; the policy says so.  Copyright 2026 INPUTLOOP; GPL-3.0-or-later.
server {
    listen 80;
    listen [::]:80;
    server_name chadtab.com www.chadtab.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chadtab.com/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://chadtab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chadtab.com;
    ssl_certificate     /etc/letsencrypt/live/chadtab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadtab.com/privkey.pem;
    return 301 https://chadtab.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chadtab.com;
    ssl_certificate     /etc/letsencrypt/live/chadtab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadtab.com/privkey.pem;
    root /var/www/chadtab.com/public;
    index index.html;
    autoindex off;
    charset utf-8;
    charset_types text/css application/json text/plain;
    types { application/json jsonl; }
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        try_files $uri $uri/ =404;
    }
}
