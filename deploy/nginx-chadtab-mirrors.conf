# Chad's hall of mirrors on gw33: chadtab.net and chadtab.org (and their www) each answer 301 to chadtab.com,
# keeping the path; certbot's renewals answer over plain http from chadtab.com's webroot.  When Chad's vanity wants
# a view of its own on a mirror, that mirror gets a server block of its own.  Copyright 2026 INPUTLOOP; GPL-3.0-or-later.
server {
    listen 80;
    listen [::]:80;
    server_name chadtab.net www.chadtab.net chadtab.org www.chadtab.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chadtab.com/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://chadtab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chadtab.net www.chadtab.net chadtab.org www.chadtab.org;
    ssl_certificate     /etc/letsencrypt/live/chadtab-mirrors/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadtab-mirrors/privkey.pem;
    return 301 https://chadtab.com$request_uri;
}
