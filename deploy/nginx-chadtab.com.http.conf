# chadtab.com on gw33, first stage: plain http only, so certbot can prove the name (install-tls.sh then
# swaps in nginx-chadtab.com.conf).  Copyright 2026 INPUTLOOP; GPL-3.0-or-later.  Mentat (for Corwin).
server {
    listen 80;
    listen [::]:80;
    server_name chadtab.com www.chadtab.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chadtab.com/acme;
        default_type text/plain;
    }
    root /var/www/chadtab.com/public;
    index index.html;
    charset utf-8;
}
